id = "acore"
name = "Acore"
version = "0.1.4"
schema_version = 1
authors = ["AxiomCore contributors"]
description = "Compiler-backed Acore configuration, backend, frontend and database authoring"
# Public adapter source; the compatible native server is distributed separately.
repository = "https://github.com/AxiomCore/acore-zed"
snippets = ["snippets/acore.json"]

# Inspect only the selected executable's version interface. No arbitrary args.
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["--version-json"]

[grammars.acore]
repository = "https://github.com/AxiomCore/tree-sitter-acore"
rev = "39bfab9ded526cf141bfdc18416c92cd2bcfca1f"

[language_servers.acore-lsp]
name = "Acore Language Server"
languages = ["Acore", "TOML", "JSON"]

[language_servers.acore-lsp.language_ids]
"Acore" = "acore"
"TOML" = "toml"
"JSON" = "json"
